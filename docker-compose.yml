version: '3.8'

services:
  # Core PostgreSQL Database Container (FR-13, FR-68)
  postgres:
    image: postgres:15-alpine
    container_name: kavach-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kavach_welfare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # FastAPI Backend API Server (FR-4)
  kavach-backend:
    container_name: kavach-backend
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kavach}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-kavach_welfare}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in .env}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      ENVIRONMENT: production
    depends_on:
      - postgres
    restart: unless-stopped

  # React + TypeScript Frontend Client (FR-68)
  kavach-web:
    container_name: kavach-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MOCKS: "false"
    ports:
      - "8080:80"
    depends_on:
      - kavach-backend
    restart: unless-stopped

volumes:
  postgres_data:
